server.port=8080

# USER SERVICE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/users/**

# REQUEST SERVICE
spring.cloud.gateway.routes[1].id=request-service
spring.cloud.gateway.routes[1].uri=lb://request-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/*/requests/**,/users/*/events/*/requests/**

# EVENT SERVICE
spring.cloud.gateway.routes[2].id=event-service
spring.cloud.gateway.routes[2].uri=lb://event-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/events/**,/users/*/events/**,/admin/events/**,/categories/**,/admin/categories/**

# COMPILATION SERVICE
spring.cloud.gateway.routes[3].id=compilation-service
spring.cloud.gateway.routes[3].uri=lb://compilation-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/compilations/**,/admin/compilations/**

# STATS SERVICE
spring.cloud.gateway.routes[4].id=stats-server
spring.cloud.gateway.routes[4].uri=lb://stats-server
spring.cloud.gateway.routes[4].predicates[0]=Path=/hit,/stats