server.port=0

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=aggregator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=ru.practicum.ewm.stats.aggregator.kafka.user.UserActionAvroDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=ru.practicum.ewm.stats.aggregator.kafka.event.EventSimilarityAvroSerializer